[tool.poetry]
name = "trimero_mod"
version = "0.1.0"
description = "Simulación de trimero atómico en Python"
authors = ["Javier Aguilera <aguilerajavier58@gmail.com>"]
readme = "README.md"
packages = [{ include = "trimero", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13"
numpy = "^2.3.1"
scipy = "^1.16.0"
matplotlib = "^3.10.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests de caracterización end-to-end (~3.5 min cada uno)",
]
